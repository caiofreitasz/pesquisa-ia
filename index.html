<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>

<body>
    <div class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>

        <div class="caixa-perguntas">
            <p>
                Assim que saiu da escola você se depara com uma nova tecnologia,
                um chat que consegue responder todas as dúvidas que uma pessoa
                pode ter. Ele também gera imagens e áudios hiper-realistas.
                Qual o primeiro pensamento?
            </p>
        </div>

        <div class="caixa-alternativas">
            <button>Isso é assustador!</button>
            <button>Isso é maravilhoso!</button>
        </div>

        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
